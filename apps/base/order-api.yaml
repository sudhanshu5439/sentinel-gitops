apiVersion: v1
kind: Service
metadata:
  name: order-api
spec:
  selector:
    app: order-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-api
  labels:
    app: order-api
spec:
  # 4 replicas so canary steps map to real traffic shares without a service mesh:
  # 1 canary pod of 4 = 25% of requests, 2 of 4 = 50%, 3 of 4 = 75%.
  replicas: 4
  revisionHistoryLimit: 3
  strategy:
    canary:
      canaryMetadata:
        labels: { role: canary }
      stableMetadata:
        labels: { role: stable }
      # Runs in the background from the first pause until the rollout finishes.
      # Any failed measurement aborts the rollout and scales the canary back to zero.
      analysis:
        templates:
          - templateName: order-api-canary-health
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 25
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 75
        - pause: { duration: 1m }
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-api
          image: ghcr.io/sudhanshu5439/sentinel-order-api
          ports:
            - name: http
              containerPort: 8000
          # Fault switches (error rate, latency), set per environment in Git. Changing them is how
          # the chaos scenarios simulate a bad release.
          envFrom:
            - configMapRef:
                name: order-api-faults
          env:
            - name: SERVICE_VERSION
              value: dev
            - name: RISK_ENGINE_URL
              value: http://risk-engine:8080
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # $(VAR) expands an env var defined above, so the password never appears in the manifest
            - name: DATABASE_URL
              value: postgresql://sentinel:$(POSTGRES_PASSWORD)@postgres:5432/sentinel
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
