apiVersion: v1
kind: Service
metadata:
  name: risk-engine
spec:
  selector:
    app: risk-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  labels:
    app: risk-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: risk-engine
          image: ghcr.io/sudhanshu5439/sentinel-risk-engine
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_VERSION
              value: dev
            - name: MAX_NOTIONAL
              value: "1000000"
            - name: MAX_QUANTITY
              value: "10000"
          # Probe budget for a CPU-starved laptop (the default 1s timeout restarted healthy pods):
          # startup gives a slow boot up to 60s, readiness only pulls traffic, and
          # liveness (the one that restarts) needs ~60s of consecutive failures.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
