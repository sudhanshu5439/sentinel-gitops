# STAGING: updated automatically by CI on every merge to main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentinel-staging
resources:
- namespace.yaml
- ../../base
images:
- digest: sha256:8e9137284bb89469bae7b25ba412864e5396a6a2082990942912cccec33edf94
  name: ghcr.io/sudhanshu5439/sentinel-notifier
  newName: ghcr.io/sudhanshu5439/sentinel-notifier
- digest: sha256:b914dada49c2f3610f9c9480e7740dceb9c69cbb1ce23b5601f3d36c652bd404
  name: ghcr.io/sudhanshu5439/sentinel-order-api
  newName: ghcr.io/sudhanshu5439/sentinel-order-api
- digest: sha256:77f698cd3d5e3fc75b938cf4c18b04428952227efb6e478604b39c481ca347f0
  name: ghcr.io/sudhanshu5439/sentinel-risk-engine
  newName: ghcr.io/sudhanshu5439/sentinel-risk-engine
configurations:
- kustomize-rollout-config.yaml
# Fault injection for chaos testing. 0 = healthy. `make canary-bad` raises FAULT_ERROR_RATE here.
# Generated ConfigMaps get a new name (hash) whenever their content changes. Old ones must NOT be
# pruned: stable pods of the previous revision still reference them, and a rollback or an aborted
# canary scales those pods back up. Without this, they fail with CreateContainerConfigError.
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
configMapGenerator:
- literals:
  - FAULT_ERROR_RATE=0
  - FAULT_LATENCY_MS=0
  name: order-api-faults
