# Kyverno admission controller, installed from its official Helm chart (pinned version),
# sized down for a laptop cluster. Sync wave -2: must exist before the policies and the apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Let the API server compute the diff (dry-run apply), so server-side defaults on Kyverno's
    # large CRDs don't show up as a fake OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2   # Kyverno v1.19.2
    helm:
      valuesObject:
        admissionController:
          replicas: 1
          container:
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { memory: 384Mi }
        backgroundController:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
        reportsController:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
        cleanupController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # Kyverno's CRDs are too large for client-side apply
