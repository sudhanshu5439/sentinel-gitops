# Metrics and alerting: Prometheus (via the Prometheus Operator), Alertmanager and Grafana.
# Grafana is wired to Loki (logs) and Tempo (traces) so you can jump between all three.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.14.0
    helm:
      valuesObject:
        fullnameOverride: kps          # -> service kps-prometheus.monitoring:9090
        defaultRules:
          create: false                # SLO rules come later; saves CPU/RAM now
        grafana:
          enabled: true
          fullnameOverride: grafana    # -> service grafana.monitoring:80
          persistence:
            enabled: false           # dashboards and datasources are provisioned from Git
          # Grafana starts one process per backend plugin, and all of them share this
          # container's memory limit. Loading ~15 unused datasources in 384Mi made start-up
          # take >160s, so the liveness probe killed it (exit 137). Load only what we use.
          grafana.ini:
            server:
              root_url: http://grafana.localtest.me:8080   # served by Traefik (platform/ingress)
            plugins:
              # Unused core datasources (one comma-separated string, no spaces).
              disable_plugins: "elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,stackdriver,cloudwatch,graphite,zipkin,grafana-azure-monitor-datasource,parca,grafana-testdata-datasource"
              preinstall_disabled: true   # no plugin downloads from the internet at boot
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          # Dashboards: any ConfigMap labelled grafana_dashboard=1 (see platform/observability).
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              url: http://loki-gateway.monitoring.svc
              jsonData:
                # Click a trace_id in a log line to open the trace in Tempo.
                derivedFields:
                  - name: TraceID
                    datasourceUid: tempo
                    matcherRegex: '"trace_id": ?"(\w+)"'
                    url: "$${__value.raw}"
            - name: Tempo
              uid: tempo
              type: tempo
              url: http://tempo.monitoring.svc:3200
              jsonData:
                # From a span, open the logs of the same trace in Loki.
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  spanStartTimeShift: "-5m"
                  spanEndTimeShift: "5m"
                serviceMap:
                  datasourceUid: prometheus
        alertmanager:
          enabled: true
          alertmanagerSpec:
            externalUrl: http://alertmanager.localtest.me:8080   # links in notifications
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
          # Routing stays on the built-in 'null' receiver for now; the AIOps step adds a webhook.
        nodeExporter:
          enabled: false
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        prometheusOperator:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
        prometheus:
          prometheusSpec:
            externalUrl: http://prometheus.localtest.me:8080   # alert generatorURL links
            retention: 2d
            scrapeInterval: 15s
            # Pick up every PodMonitor/ServiceMonitor/rule, not only ones labelled for this release.
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 256Mi }
              limits: { memory: 1Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
