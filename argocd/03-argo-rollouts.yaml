# Argo Rollouts: progressive delivery controller (canary with automated analysis).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.8   # Argo Rollouts v1.10.1
    helm:
      valuesObject:
        controller:
          replicas: 1
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
        dashboard:
          enabled: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
