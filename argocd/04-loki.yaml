# Loki: log storage, single process ("Monolithic") on a small volume. Logs are shipped by Alloy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 20.0.2   # Loki 3.7.9
    helm:
      valuesObject:
        fullnameOverride: loki          # -> service loki-gateway.monitoring:80
        deploymentMode: Monolithic
        loki:
          auth_enabled: false           # single tenant lab
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
        singleBinary:
          replicas: 1
          persistence:
            size: 2Gi
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        gateway:
          replicas: 1
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
