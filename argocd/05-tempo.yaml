# Tempo: distributed tracing backend, single process, traces kept for 24 h on local disk.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 3.2.1    # Tempo 3.1.1
    helm:
      valuesObject:
        fullnameOverride: tempo        # -> service tempo.monitoring:3200 (query), :4317 (OTLP)
        tempo:
          retention: 24h
          # The chart's port templates expect the Jaeger receiver to exist (setting it to null
          # breaks rendering, caught by scripts/render-helm.sh), so it stays; only OTLP is used.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
