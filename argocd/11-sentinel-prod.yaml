# Sentinel apps in the prod environment. Argo CD keeps the cluster equal to Git:
# selfHeal reverts manual changes, prune removes what was deleted from Git.
# The DB password Secret is created out of band (make gitops-secrets) and never stored in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sudhanshu5439/sentinel-gitops
    targetRevision: main
    path: apps/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
