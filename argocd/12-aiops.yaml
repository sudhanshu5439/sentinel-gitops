# The incident assistant (sentinel repo, aiops/): Alertmanager webhook -> evidence -> cited LLM
# diagnosis -> Slack. Read-only RBAC; its Secret is created out of band (make aiops-secrets).
# The image digest is committed here by the sentinel repo's CI after it is built, scanned, signed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sudhanshu5439/sentinel-gitops
    targetRevision: main
    path: platform/aiops
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
