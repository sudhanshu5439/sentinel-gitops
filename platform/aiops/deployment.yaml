# sentinel-assistant: Alertmanager webhook -> evidence -> cited LLM diagnosis -> Slack.
# Secrets (Anthropic key, Slack webhook) come from the `sentinel-assistant` Secret, created out of
# band by `make aiops-secrets` in the sentinel repo and never stored in Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-assistant
  namespace: aiops
  labels: { app: sentinel-assistant }
spec:
  replicas: 1   # incidents live in memory; one replica = one view of each incident
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: sentinel-assistant }
  template:
    metadata:
      labels: { app: sentinel-assistant }
    spec:
      serviceAccountName: sentinel-assistant
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: assistant
          image: ghcr.io/sudhanshu5439/sentinel-assistant
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: PROMETHEUS_URL, value: "http://kps-prometheus.monitoring.svc:9090" }
            - { name: LOKI_URL, value: "http://loki-gateway.monitoring.svc" }
            - { name: KUBE_API_URL, value: "https://kubernetes.default.svc" }
            - { name: ARGOCD_NAMESPACE, value: argocd }
            - { name: LLM_MODEL, value: claude-haiku-5-5 }
            - { name: LLM_BUDGET_USD, value: "0.02" }
            # Two off switches. This one is audited and slow (a Git commit + restart). The
            # break-glass one is the optional `sentinel-assistant-switch` ConfigMap below, kept
            # out of Git so self-heal cannot revert it; re-read before every diagnosis.
            - { name: LLM_ENABLED, value: "true" }
            # Step 8: the action policy runs and every decision is audited. Going live is a
            # reviewed commit here, never a runtime toggle (`make actions-off` stops it at once).
            # Live in staging only: prod incidents are still diagnosed, decided and audited, but
            # the blast-radius guard blocks any action there (and RBAC has no write in prod).
            - { name: ACTION_MODE, value: live }
            - { name: ALLOWED_NAMESPACES, value: sentinel-staging }
            - { name: PROD_NAMESPACES, value: sentinel-prod }
            - { name: ACTIONS_PER_HOUR, value: "3" }
            - { name: ACTION_COOLDOWN_MINUTES, value: "30" }
          # ANTHROPIC_API_KEY, SLACK_WEBHOOK_URL, AUDIT_DATABASE_URL (the assistant role's DSN).
          envFrom:
            - secretRef: { name: sentinel-assistant }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kill-switch, mountPath: /etc/assistant/switch, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: kill-switch
          configMap:
            name: sentinel-assistant-switch   # created by `make aiops-off` (sentinel repo)
            optional: true                    # absent = switch not engaged
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-assistant
  namespace: aiops
spec:
  selector: { app: sentinel-assistant }
  ports:
    - { name: http, port: 8000, targetPort: http }
