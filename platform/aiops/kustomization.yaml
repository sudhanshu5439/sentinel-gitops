apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` here: the RBAC objects deliberately live in the namespaces the
# assistant reads (staging, prod, argocd), and that field would move them all into aiops.
resources:
- namespace.yaml
- rbac.yaml
- deployment.yaml
# CI (sentinel repo, promote-assistant job) pins this to the digest it built, scanned and signed.
images:
- digest: sha256:242a54a9bc20bac400b50de890d817026fc4f3cd930d745be9ba5b9876a069e8
  name: ghcr.io/sudhanshu5439/sentinel-assistant
  newName: ghcr.io/sudhanshu5439/sentinel-assistant
