---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rollouts
  namespace: argo-rollouts
spec:
  ingressClassName: traefik
  rules:
    - host: rollouts.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: argo-rollouts-dashboard, port: { number: 3100 } }
